<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bouteilles 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; }
    #msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); font-family: sans-serif; font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <div id="msg">Chargement...</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three'
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

    const msg     = document.getElementById('msg')
    const p       = new URLSearchParams(window.location.search)
    const cam     = parseFloat(p.get('cam')     || '7')
    const spacing = parseFloat(p.get('spacing') || '1.4')
    const rotY    = parseFloat(p.get('roty')    || '270')

    const seen = new Set()
    const bottles = []
    for (let i = 1; i <= 5; i++) {
      const url = p.get('url' + i)
      if (url && !seen.has(url)) {
        seen.add(url)
        bottles.push({ url, link: p.get('link' + i) || '/', scale: parseFloat(p.get('scale' + i) || '1') })
      }
    }

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
    renderer.setSize(window.innerWidth, window.innerHeight)
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
    renderer.outputColorSpace = THREE.SRGBColorSpace
    renderer.toneMapping = THREE.ACESFilmicToneMapping
    renderer.toneMappingExposure = 1.2
    document.body.appendChild(renderer.domElement)

    const scene  = new THREE.Scene()
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000)
    camera.position.set(0, 1, cam)
    camera.lookAt(0, 1, 0)

    scene.add(new THREE.AmbientLight(0xffffff, 0.9))
    const l1 = new THREE.DirectionalLight(0xffffff, 1.5); l1.position.set(5, 8, 5); scene.add(l1)
    const l2 = new THREE.DirectionalLight(0xffffff, 0.5); l2.position.set(-5, 3, -3); scene.add(l2)
    const l3 = new THREE.DirectionalLight(0xffffff, 0.3); l3.position.set(0, -2, 5); scene.add(l3)

    // ─────────────────────────────────────────────────────────────────────
    // 📌 ENV MAP — génère une carte d'environnement pour les reflets du verre
    // Sans env map = verre noir. Avec env map = reflets réalistes
    // ─────────────────────────────────────────────────────────────────────
    const pmrem  = new THREE.PMREMGenerator(renderer)
    const envScene = new THREE.Scene()

    // Lumières colorées pour simuler un environnement studio
    ;[
      { color: 0xfff5e0, intensity: 4,   pos: [5,  8,  5]  },  // Soleil chaud
      { color: 0xc8e8ff, intensity: 3,   pos: [-5, 5, -5]  },  // Ciel bleu
      { color: 0xffffff, intensity: 2,   pos: [0, -4,  0]  },  // Rebond sol
      { color: 0xffe0c0, intensity: 1.5, pos: [0,  6, -8]  },  // Contre-jour
    ].forEach(({ color, intensity, pos }) => {
      const l = new THREE.PointLight(color, intensity, 30)
      l.position.set(...pos)
      envScene.add(l)
    })
    envScene.add(new THREE.AmbientLight(0xffffff, 1))

    const envTexture = pmrem.fromScene(envScene).texture
    pmrem.dispose()
    scene.environment = envTexture  // Applique l'env map à toute la scène

    // ─────────────────────────────────────────────────────────────────────
    // 📌 FIX VERRE — applique MeshPhysicalMaterial sur les matériaux verre
    // ─────────────────────────────────────────────────────────────────────
    function fixGlass(obj) {
      obj.traverse((child) => {
        if (!child.isMesh) return
        const mats = Array.isArray(child.material) ? child.material : [child.material]
        mats.forEach((mat, idx) => {
          if (!mat) return
          const name = (mat.name || '').toLowerCase()
          const isGlass = mat.transmission > 0 ||
                          name.includes('glass') ||
                          name.includes('verre') ||
                          name.includes('wine') ||
                          (name.includes('bottle') && !name.includes('label') && !name.includes('cork') && !name.includes('cap'))

          if (isGlass) {
            const color = mat.color ? mat.color.clone() : new THREE.Color(0.02, 0.08, 0.02)
            const newMat = new THREE.MeshPhysicalMaterial({
              color,
              transmission:      0.95,   // Quasi totalement transparent
              roughness:         0.03,   // Ultra lisse = reflets nets
              metalness:         0.0,
              thickness:         2.0,    // Épaisseur simulée du verre
              ior:               1.52,   // Indice de réfraction du verre réel
              envMap:            envTexture,
              envMapIntensity:   2.5,
              side:              THREE.FrontSide,
            })
            if (Array.isArray(child.material)) child.material[idx] = newMat
            else child.material = newMat
          } else {
            // Matériaux opaques — booster les reflets
            mat.envMap = envTexture
            mat.envMapIntensity = 1.0
            mat.needsUpdate = true
          }
        })
      })
    }

    // ── Easings ──────────────────────────────────────────────────────────
    function easeOutElastic(t) {
      if (t === 0 || t === 1) return t
      return Math.pow(2, -10 * t) * Math.sin((t - 0.1) * (2 * Math.PI) / 0.4) + 1
    }
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3)
    }

    // Initialiser animState pour tous les indices possibles
    const animState = {}
    for (let i = 0; i < 5; i++) animState[i] = { progress: 0 }

    const loader  = new GLTFLoader()
    const models  = []
    const hovered = {}
    const startX  = bottles.length ? -((bottles.length - 1) * spacing) / 2 : 0
    let done = 0

    function placeModel(gltf, i, bottleScale) {
      const obj = gltf.scene
      obj.rotation.y = THREE.MathUtils.degToRad(rotY)
      fixGlass(obj)  // 🔧 Applique le matériau verre

      const tmp = new THREE.Group()
      tmp.add(obj)
      scene.add(tmp)
      tmp.updateMatrixWorld(true)
      const box1   = new THREE.Box3().setFromObject(tmp)
      const size1  = box1.getSize(new THREE.Vector3())
      const maxDim = Math.max(size1.x, size1.y, size1.z)
      scene.remove(tmp)

      const s = (1.8 * bottleScale) / maxDim
      tmp.scale.setScalar(s)
      scene.add(tmp)
      tmp.updateMatrixWorld(true)
      const box2   = new THREE.Box3().setFromObject(tmp)
      const center = box2.getCenter(new THREE.Vector3())
      tmp.position.x -= center.x
      tmp.position.z -= center.z
      tmp.position.y -= box2.min.y
      scene.remove(tmp)

      const group = new THREE.Group()
      group.add(tmp)
      group.position.set(startX + i * spacing, -0.5, 0)
      scene.add(group)

      hovered[i] = false

      models.push({
        group,
        baseY:   -0.5,
        tiltDir: i % 2 === 0 ? 1 : -1,
        link:    bottles[i].link,
        idx:     i
      })

      done++
      if (done === bottles.length) msg.style.display = 'none'
    }

    bottles.forEach((bottle, i) => {
      loader.load(bottle.url, (gltf) => placeModel(gltf, i, bottle.scale),
        undefined, (err) => { console.error(err); done++ })
    })

    const ray = new THREE.Raycaster(), mouse = new THREE.Vector2()
    function getHit(e) {
      const r = renderer.domElement.getBoundingClientRect()
      mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1)
      ray.setFromCamera(mouse, camera)
      const hits = ray.intersectObjects(models.map(m => m.group), true)
      if (!hits.length) return null
      let o = hits[0].object
      while (o.parent && !models.find(m => m.group === o)) o = o.parent
      return models.find(m => m.group === o) || null
    }

    window.addEventListener('mousemove', e => {
      models.forEach(m => hovered[m.idx] = false)
      const h = getHit(e)
      if (h) { hovered[h.idx] = true; renderer.domElement.style.cursor = 'pointer' }
      else renderer.domElement.style.cursor = 'default'
    })

    window.addEventListener('click', e => {
      const h = getHit(e)
      if (h?.link) window.parent.postMessage({ type: 'navigate', link: h.link }, '*')
    })

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(window.innerWidth, window.innerHeight)
    })

    function animate() {
      requestAnimationFrame(animate)

      models.forEach(m => {
        const h = hovered[m.idx]
        const a = animState[m.idx]
        if (!a) return

        // Progression 0→1 au hover, 1→0 au déhover
        if (h) a.progress = Math.min(1, a.progress + 0.06)
        else   a.progress = Math.max(0, a.progress - 0.045)

        const ep = easeOutElastic(a.progress)  // Rebond à l'entrée
        const cp = easeOutCubic(a.progress)    // Doux à la sortie

        // Montée avec rebond élastique
        const targetY = m.baseY + 0.28 * ep
        m.group.position.y += (targetY - m.group.position.y) * 0.12

        // Rotation Y — tourne légèrement vers la caméra
        const targetRotY = m.tiltDir * 0.2 * cp
        m.group.rotation.y += (targetRotY - m.group.rotation.y) * 0.08

        // Inclinaison Z légère
        const targetRotZ = m.tiltDir * 0.06 * cp
        m.group.rotation.z += (targetRotZ - m.group.rotation.z) * 0.08

        // Scale — grandit légèrement avec rebond
        const targetScale = 1 + 0.03 * ep
        m.group.scale.setScalar(targetScale)
      })

      renderer.render(scene, camera)
    }
    animate()
  </script>
</body>
</html>
