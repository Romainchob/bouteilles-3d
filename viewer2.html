<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bouteilles 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; }
    #msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); font-family: sans-serif; font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <div id="msg">Chargement...</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three'
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'

    const msg     = document.getElementById('msg')
    const p       = new URLSearchParams(window.location.search)
    const cam     = parseFloat(p.get('cam') || '7')
    const spacing = parseFloat(p.get('spacing') || '1.4')
    const rotY    = parseFloat(p.get('roty') || '0') // rotation Y en degrés

    // Récupère les bouteilles avec scale individuel
    const bottles = []
    for (let i = 1; i <= 5; i++) {
      const url = p.get('url' + i)
      if (url) bottles.push({
        url,
        link:  p.get('link' + i) || '/',
        scale: parseFloat(p.get('scale' + i) || p.get('scale') || '1'),
      })
    }

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
    renderer.setSize(window.innerWidth, window.innerHeight)
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
    renderer.outputColorSpace = THREE.SRGBColorSpace
    renderer.toneMapping = THREE.ACESFilmicToneMapping
    renderer.toneMappingExposure = 1.2
    document.body.appendChild(renderer.domElement)

    const scene  = new THREE.Scene()
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000)
    camera.position.set(0, 1.5, cam)
    camera.lookAt(0, 0.5, 0)

    scene.add(new THREE.AmbientLight(0xffffff, 1))
    const l1 = new THREE.DirectionalLight(0xffffff, 1.5); l1.position.set(5, 8, 5); scene.add(l1)
    const l2 = new THREE.DirectionalLight(0xffffff, 0.5); l2.position.set(-5, 3, -3); scene.add(l2)

    const loader  = new GLTFLoader()
    const models  = []
    const hovered = {}
    const startX  = bottles.length ? -((bottles.length - 1) * spacing) / 2 : 0
    let done = 0

    function placeModel(gltf, i, bottleScale) {
      const obj = gltf.scene

      // Appliquer rotation Y pour orienter vers la caméra
      obj.rotation.y = THREE.MathUtils.degToRad(rotY)

      // Ajouter temporairement pour calcul de bounding box
      const tmp = new THREE.Group()
      tmp.add(obj)
      scene.add(tmp)
      tmp.updateMatrixWorld(true)

      const box1   = new THREE.Box3().setFromObject(tmp)
      const size1  = box1.getSize(new THREE.Vector3())
      const maxDim = Math.max(size1.x, size1.y, size1.z)

      scene.remove(tmp)
      const s = (1.8 * bottleScale) / maxDim
      tmp.scale.setScalar(s)

      scene.add(tmp)
      tmp.updateMatrixWorld(true)
      const box2   = new THREE.Box3().setFromObject(tmp)
      const center = box2.getCenter(new THREE.Vector3())
      tmp.position.x -= center.x
      tmp.position.z -= center.z
      tmp.position.y -= box2.min.y
      scene.remove(tmp)

      const group = new THREE.Group()
      group.add(tmp)
      group.position.set(startX + i * spacing, 0, 0)
      scene.add(group)

      hovered[i] = false
      models.push({ group, baseY: 0, tiltDir: i % 2 === 0 ? 1 : -1, link: bottles[i].link, idx: i })

      done++
      if (done === bottles.length) msg.style.display = 'none'
    }

    bottles.forEach((bottle, i) => {
      loader.load(bottle.url, (gltf) => {
        placeModel(gltf, i, bottle.scale)
      }, undefined, (err) => {
        console.error('GLB error:', bottle.url, err)
        done++
      })
    })

    const ray   = new THREE.Raycaster()
    const mouse = new THREE.Vector2()

    function getHit(e) {
      const r = renderer.domElement.getBoundingClientRect()
      mouse.set(
        ((e.clientX - r.left) / r.width) * 2 - 1,
        -((e.clientY - r.top) / r.height) * 2 + 1
      )
      ray.setFromCamera(mouse, camera)
      const hits = ray.intersectObjects(models.map(m => m.group), true)
      if (!hits.length) return null
      let o = hits[0].object
      while (o.parent && !models.find(m => m.group === o)) o = o.parent
      return models.find(m => m.group === o) || null
    }

    window.addEventListener('mousemove', e => {
      models.forEach(m => hovered[m.idx] = false)
      const h = getHit(e)
      if (h) { hovered[h.idx] = true; renderer.domElement.style.cursor = 'pointer' }
      else renderer.domElement.style.cursor = 'default'
    })

    window.addEventListener('click', e => {
      const h = getHit(e)
      if (h && h.link) {
        window.parent.postMessage({ type: 'navigate', link: h.link }, '*')
        try { window.top.location.href = h.link } catch (e) {}
      }
    })

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(window.innerWidth, window.innerHeight)
    })

    function animate() {
      requestAnimationFrame(animate)
      models.forEach(m => {
        const h = hovered[m.idx]
        m.group.position.y += ((h ? 0.22 : m.baseY) - m.group.position.y) * 0.09
        m.group.rotation.z += ((h ? m.tiltDir * 0.07 : 0) - m.group.rotation.z) * 0.09
      })
      renderer.render(scene, camera)
    }
    animate()
  </script>
</body>
</html>
