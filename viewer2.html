<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bouteilles 3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    canvas {
      display: block;
    }

    #msg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: sans-serif;
      font-size: 13px;
      color: #555;
    }

    #tooltip {
      position: fixed;
      pointer-events: none;
      display: none;
      transform: translate(-50%, -100%);
      margin-top: -12px;
      z-index: 999;
      transition: opacity 0.15s ease;
    }
  </style>
</head>

<body>
  <div id="msg">Chargement...</div>
  <div id="tooltip"></div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three'
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js'

    const msg = document.getElementById('msg')
    const p = new URLSearchParams(window.location.search)
    const cam = parseFloat(p.get('cam') || '7')
    const spacing = parseFloat(p.get('spacing') || '1.4')
    const rotY = parseFloat(p.get('roty') || '270')

    // ── Paramètres tooltip ───────────────────────────────────────────────
    const tooltipBg = p.get('tooltipBg') || 'rgba(0,0,0,0.75)'
    const tooltipColor = p.get('tooltipColor') || '#ffffff'
    const tooltipFont = p.get('tooltipFont') || 'sans-serif'
    const tooltipSize = p.get('tooltipSize') || '13px'
    const tooltipRadius = p.get('tooltipRadius') || '6px'
    const tooltipPadding = p.get('tooltipPadding') || '6px 12px'
    const labels = {}
    for (let i = 1; i <= 5; i++) {
      labels[i] = p.get('label' + i) || ''
    }

    // Appliquer le style du tooltip
    const tooltip = document.getElementById('tooltip')
    tooltip.style.background = tooltipBg
    tooltip.style.color = tooltipColor
    tooltip.style.fontFamily = tooltipFont
    tooltip.style.fontSize = tooltipSize
    tooltip.style.borderRadius = tooltipRadius
    tooltip.style.padding = tooltipPadding
    tooltip.style.whiteSpace = 'nowrap'
    tooltip.style.boxShadow = '0 4px 20px rgba(0,0,0,0.2)'
    tooltip.style.backdropFilter = 'blur(8px)'

    const seen = new Set()
    const bottles = []
    for (let i = 1; i <= 5; i++) {
      const url = p.get('url' + i)
      if (url && !seen.has(url)) {
        seen.add(url)
        bottles.push({ url, link: p.get('link' + i) || '/', scale: parseFloat(p.get('scale' + i) || '1') })
      }
    }

    // Fallback: If no bottles are specified in the URL query parameters, load the local files by default.
    if (bottles.length === 0) {
      console.log("No custom model parameters (?url1=...) found in the URL. Loading default local models.");
      const defaults = [
        { url: 'Canette2.glb', label: 'Canette' },
        { url: 'bierre.glb', label: 'Bière' },
        { url: 'bottlemiglia.glb', label: 'Miglia' },
        { url: 'papa.glb', label: 'Papa' },
        { url: 'rougeglb.glb', label: 'Rouge' }
      ]
      defaults.forEach((item, idx) => {
        bottles.push({ url: item.url, link: '/', scale: 1 })
        labels[idx + 1] = item.label
      })
    }

    // ── Renderer ──────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
    renderer.setSize(window.innerWidth, window.innerHeight)
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
    renderer.outputColorSpace = THREE.SRGBColorSpace
    renderer.toneMapping = THREE.ACESFilmicToneMapping
    renderer.toneMappingExposure = 1.0
    document.body.appendChild(renderer.domElement)

    // ── Env Map pour reflets réalistes ────────────────────────────────────
    const pmrem = new THREE.PMREMGenerator(renderer)
    const envScene = new THREE.Scene()
      ;[
        { color: 0xfff5e0, intensity: 4, pos: [5, 8, 5] },
        { color: 0xc8e8ff, intensity: 3, pos: [-5, 5, -5] },
        { color: 0xffffff, intensity: 2, pos: [0, -4, 0] },
        { color: 0xffe0c0, intensity: 1.5, pos: [0, 6, -8] },
      ].forEach(({ color, intensity, pos }) => {
        const l = new THREE.PointLight(color, intensity, 30)
        l.position.set(...pos)
        envScene.add(l)
      })
    envScene.add(new THREE.AmbientLight(0xffffff, 1))
    let envTexture = pmrem.fromScene(envScene).texture
    pmrem.dispose()

    // ── Scène & Caméra ────────────────────────────────────────────────────
    const scene = new THREE.Scene()
    scene.environment = envTexture

    // Dynamically update materials across all loaded bottles once HDR is ready
    function updateSceneEnv(newEnv) {
      envTexture = newEnv
      scene.environment = envTexture
      models.forEach(m => {
        m.group.traverse(child => {
          if (!child.isMesh) return
          const mats = Array.isArray(child.material) ? child.material : [child.material]
          mats.forEach(mat => {
            if (!mat) return
            mat.envMap = envTexture
            mat.needsUpdate = true
          })
        })
      })
    }

    // Load bambanani_sunset_2k.hdr
    new RGBELoader().load('bambanani_sunset_2k.hdr', (hdrTex) => {
      hdrTex.mapping = THREE.EquirectangularReflectionMapping
      updateSceneEnv(hdrTex)
    }, undefined, (err) => {
      console.error('Failed to load bambanani_sunset_2k.hdr environment map:', err)
    })

    // ── lil-gui Configuration & Control Panel ─────────────────────────────
    const guiParams = {
      exposure: 1.0,
      transmission: 1.0,
      roughness: 0.0,
      metalness: 0.0,
      ior: 1.2,
      thickness: 0.25,
      dispersion: 1.9,
      envMapIntensity: 3.1
    }

    function updateMaterials() {
      renderer.toneMappingExposure = guiParams.exposure
      models.forEach(m => {
        const isRouge = (m.url || '').toLowerCase().includes('rouge')
        m.group.traverse(child => {
          if (!child.isMesh) return
          const mats = Array.isArray(child.material) ? child.material : [child.material]
          mats.forEach(mat => {
            if (!mat || !mat.userData.isGlass) return
            const name = (mat.name || '').toLowerCase()
            const isOuterGlass = isRouge && (name.includes('white') || name.includes('wine'))
            const isInnerWine = isRouge && name.includes('glas')

            mat.transmission = isRouge ? 1.0 : guiParams.transmission
            mat.roughness = isRouge ? 0.01 : guiParams.roughness
            mat.metalness = guiParams.metalness
            mat.ior = isOuterGlass ? 1.52 : (isInnerWine ? 1.34 : guiParams.ior)
            mat.thickness = isOuterGlass ? 1.5 : (isInnerWine ? 0.5 : guiParams.thickness)
            mat.dispersion = guiParams.dispersion
            mat.envMapIntensity = isOuterGlass ? 4.5 : (isInnerWine ? 2.0 : guiParams.envMapIntensity)
            mat.needsUpdate = true
          })
        })
      })
    }



    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000)
    camera.position.set(0, 1, cam)
    camera.lookAt(0, 1, 0)

    // ── Lumières ──────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xffffff, 0.6))
    const l1 = new THREE.DirectionalLight(0xfff5e0, 2.0); l1.position.set(3, 6, 4); scene.add(l1)
    const l2 = new THREE.DirectionalLight(0xc8e8ff, 0.8); l2.position.set(-4, 3, -2); scene.add(l2)
    const l3 = new THREE.DirectionalLight(0xffffff, 0.6); l3.position.set(0, 4, -5); scene.add(l3)

    // ── Fix matériaux verre ───────────────────────────────────────────────
    function fixGlass(obj, bottleUrl) {
      const filename = (bottleUrl || '').toLowerCase()
      const isCan = filename.includes('canette')

      obj.traverse((child) => {
        if (!child.isMesh) return
        const mats = Array.isArray(child.material) ? child.material : [child.material]
        mats.forEach((mat, idx) => {
          if (!mat) return
          const name = (mat.name || '').toLowerCase()

          // A mesh is considered glass if it already has transmission, or is explicitly named glass/verre/wine/bottle
          // AND it's not a metallic can (which should remain highly reflective metal!)
          const isGlass = !isCan && (
            mat.transmission > 0 ||
            name.includes('glass') ||
            name.includes('glas') || // Spelled with single 's' (matches 'glas dark')
            name.includes('verre') ||
            name.includes('wine') ||
            name.includes('biere') ||
            name.includes('beer') ||
            (name.includes('bottle') && !name.includes('label') && !name.includes('cork') && !name.includes('cap')) ||
            // Generic glass/liquid meshes inside our specific models
            (filename.includes('bottlemiglia') && name.includes('material.002'))
          )

          if (isGlass) {
            const isRouge = filename.includes('rouge')
            const isOuterGlass = isRouge && (name.includes('white') || name.includes('wine'))
            const isInnerWine = isRouge && name.includes('glas')

            // Boost very dark glass colors to be visible transmissive colors while maintaining their exact hue/tint
            const glassColor = mat.color ? mat.color.clone() : new THREE.Color(0xffffff)
            if (isOuterGlass) {
              // Outer glass bottle is beautifully clear and crisp with a very subtle warm touch
              glassColor.set('#fffef6')
            } else if (isInnerWine) {
              // Inner wine liquid is a highly vibrant, glowing golden honey color
              glassColor.set('#ecd15b')
            } else {
              const maxChannel = Math.max(glassColor.r, glassColor.g, glassColor.b)
              if (maxChannel > 0 && maxChannel < 0.18) {
                const boost = 0.18 / maxChannel
                glassColor.multiplyScalar(boost)
              }
            }

            const finalIor = isOuterGlass ? 1.52 : (isInnerWine ? 1.34 : guiParams.ior)
            const finalThickness = isOuterGlass ? 1.5 : (isInnerWine ? 0.5 : guiParams.thickness)
            const finalRoughness = isRouge ? 0.01 : guiParams.roughness
            const finalEnvIntensity = isOuterGlass ? 4.5 : (isInnerWine ? 2.0 : guiParams.envMapIntensity)
            const finalTransmission = isRouge ? 1.0 : guiParams.transmission

            // Case 1: The material already has transmissive glass setup (from KHR_materials_transmission)
            if (mat.isMeshPhysicalMaterial) {
              mat.userData.isGlass = true
              mat.color.copy(glassColor)
              mat.transparent = true
              mat.opacity = 1.0
              mat.transmission = finalTransmission
              mat.roughness = finalRoughness
              mat.metalness = guiParams.metalness
              mat.ior = finalIor
              mat.thickness = finalThickness
              mat.dispersion = guiParams.dispersion // Rainbow dispersion effect!
              mat.envMap = envTexture
              mat.envMapIntensity = finalEnvIntensity
              mat.needsUpdate = true
              return
            }

            // Case 2: Upgrade standard material to MeshPhysicalMaterial with dispersion
            const newMat = new THREE.MeshPhysicalMaterial({
              color: glassColor,
              map: mat.map || null,
              normalMap: mat.normalMap || null,
              roughnessMap: mat.roughnessMap || null,
              metalnessMap: mat.metalnessMap || null,
              aoMap: mat.aoMap || null,
              roughness: finalRoughness,
              metalness: guiParams.metalness,
              ior: finalIor,
              transmission: finalTransmission,
              thickness: finalThickness,
              dispersion: guiParams.dispersion, // Enable rainbow dispersion!
              envMap: envTexture,
              envMapIntensity: finalEnvIntensity,
              side: THREE.DoubleSide,
              transparent: true,
              opacity: 1.0
            })
            newMat.userData.isGlass = true

            if (Array.isArray(child.material)) child.material[idx] = newMat
            else child.material = newMat
          } else {
            // For non-glass materials (labels, caps, metal cans):
            // Keep their original authored textures/metallic parameters, but apply the environment map for realistic reflections!
            mat.envMap = envTexture
            mat.envMapIntensity = isCan ? 2.5 : 3.5
            mat.needsUpdate = true
          }
        })
      })
    }

    const bgParam = p.get('bg')
    if (bgParam) {
      const isHexHex = /^[0-9A-Fa-f]{3,6}$/.test(bgParam)
      const bgStyle = isHexHex ? '#' + bgParam : bgParam
      document.body.style.background = bgStyle
      if (bgStyle !== 'transparent') {
        scene.background = new THREE.Color(bgStyle)
      }
    } else {
      // Set background color fallback on the body
      document.body.style.background = '#222'

      // Load FOND map.png inside the Three.js scene so that it can be refracted by the transmissive glass!
      const texLoader = new THREE.TextureLoader()
      texLoader.load('FOND map.png', (texture) => {
        texture.colorSpace = THREE.SRGBColorSpace
        scene.background = texture

        // Keep background aspect ratio intact, behaving like CSS background-size: cover
        function adjustBackground() {
          if (!texture.image) return
          const imageAspect = texture.image.width / texture.image.height
          const screenAspect = window.innerWidth / window.innerHeight

          texture.wrapS = THREE.ClampToEdgeWrapping
          texture.wrapT = THREE.ClampToEdgeWrapping

          if (screenAspect > imageAspect) {
            texture.repeat.set(1, imageAspect / screenAspect)
            texture.offset.set(0, (1 - imageAspect / screenAspect) / 2)
          } else {
            texture.repeat.set(screenAspect / imageAspect, 1)
            texture.offset.set((1 - screenAspect / imageAspect) / 2, 0)
          }
        }

        adjustBackground()
        if (texture.image) {
          texture.image.addEventListener('load', adjustBackground)
        }
        window.addEventListener('resize', adjustBackground)
      }, undefined, (err) => {
        console.error('Failed to load FOND map.png background texture:', err)
      })
    }

    // ── Easings ───────────────────────────────────────────────────────────
    function easeOutElastic(t) {
      if (t === 0 || t === 1) return t
      return Math.pow(2, -10 * t) * Math.sin((t - 0.1) * (2 * Math.PI) / 0.4) + 1
    }
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3)
    }

    // ── Chargement GLB ────────────────────────────────────────────────────
    const loader = new GLTFLoader()
    const models = []
    const hovered = {}
    const animState = {}
    for (let i = 0; i < bottles.length; i++) animState[i] = { progress: 0 }
    const startX = bottles.length ? -((bottles.length - 1) * spacing) / 2 : 0
    let done = 0

    function placeModel(gltf, i, bottleScale) {
      const obj = gltf.scene
      obj.rotation.y = THREE.MathUtils.degToRad(rotY)


      const tmp = new THREE.Group()
      tmp.add(obj)
      scene.add(tmp)
      tmp.updateMatrixWorld(true)
      const box1 = new THREE.Box3().setFromObject(tmp)
      const size1 = box1.getSize(new THREE.Vector3())
      const maxDim = Math.max(size1.x, size1.y, size1.z)
      scene.remove(tmp)

      const s = (1.8 * bottleScale) / maxDim
      tmp.scale.setScalar(s)
      scene.add(tmp)
      tmp.updateMatrixWorld(true)
      const box2 = new THREE.Box3().setFromObject(tmp)
      const center = box2.getCenter(new THREE.Vector3())
      tmp.position.x -= center.x
      tmp.position.z -= center.z
      tmp.position.y -= box2.min.y
      scene.remove(tmp)

      const group = new THREE.Group()
      group.add(tmp)
      group.position.set(startX + i * spacing, -0.5, 0)
      scene.add(group)

      hovered[i] = false
      models.push({ group, baseY: -0.5, tiltDir: i % 2 === 0 ? 1 : -1, link: bottles[i].link, idx: i, url: bottles[i].url })
      done++
      if (done === bottles.length) msg.style.display = 'none'
      fixGlass(obj, bottles[i].url)
    }

    bottles.forEach((bottle, i) => {
      loader.load(bottle.url, (gltf) => placeModel(gltf, i, bottle.scale),
        undefined, (err) => {
          console.error(`Failed to load ${bottle.url}:`, err)
          done++
          if (done === bottles.length) msg.style.display = 'none'
        })
    })

    // ── Raycaster ─────────────────────────────────────────────────────────
    const ray = new THREE.Raycaster(), mouse = new THREE.Vector2()
    function getHit(e) {
      const r = renderer.domElement.getBoundingClientRect()
      mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1)
      ray.setFromCamera(mouse, camera)
      const hits = ray.intersectObjects(models.map(m => m.group), true)
      if (!hits.length) return null
      let o = hits[0].object
      while (o.parent && !models.find(m => m.group === o)) o = o.parent
      return models.find(m => m.group === o) || null
    }

    window.addEventListener('mousemove', e => {
      models.forEach(m => hovered[m.idx] = false)
      const h = getHit(e)
      if (h) {
        hovered[h.idx] = true
        renderer.domElement.style.cursor = 'pointer'
        // Afficher le tooltip
        const label = labels[h.idx + 1]
        if (label) {
          tooltip.textContent = label
          tooltip.style.display = 'block'
          tooltip.style.left = e.clientX + 'px'
          tooltip.style.top = (e.clientY - 16) + 'px'
        } else {
          tooltip.style.display = 'none'
        }
      } else {
        renderer.domElement.style.cursor = 'default'
        tooltip.style.display = 'none'
      }
    })

    window.addEventListener('click', e => {
      const h = getHit(e)
      if (h?.link) window.parent.postMessage({ type: 'navigate', link: h.link }, '*')
    })

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(window.innerWidth, window.innerHeight)
    })

    // ── Animation ─────────────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate)
      models.forEach(m => {
        const h = hovered[m.idx]
        const a = animState[m.idx]
        if (!a) return

        if (h) a.progress = Math.min(1, a.progress + 0.06)
        else a.progress = Math.max(0, a.progress - 0.045)

        const ep = easeOutElastic(a.progress)
        const cp = easeOutCubic(a.progress)

        m.group.position.y += ((m.baseY + 0.28 * ep) - m.group.position.y) * 0.12
        m.group.rotation.y += (m.tiltDir * 0.2 * cp - m.group.rotation.y) * 0.08
        m.group.rotation.z += (m.tiltDir * 0.06 * cp - m.group.rotation.z) * 0.08
        m.group.scale.setScalar(1 + 0.03 * ep)
      })
      renderer.render(scene, camera)
    }
    animate()
  </script>
</body>

</html>
