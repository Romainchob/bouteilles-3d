<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bouteilles 3D</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
      height: 100%;
      gap: 8px;
      padding: 20px;
    }
    .bottle-wrap {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: bottom center;
    }
    .bottle-wrap:hover {
      transform: translateY(-28px) rotate(var(--tilt, 4deg));
    }
    model-viewer {
      width: 100%;
      height: 90%;
      background: transparent;
      --progress-bar-color: transparent;
      --progress-mask: transparent;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    const p     = new URLSearchParams(window.location.search)
    const container = document.getElementById('container')
    const tilts = ['4deg', '-4deg', '4deg', '-4deg', '4deg']

    for (let i = 1; i <= 5; i++) {
      const url  = p.get('url'  + i)
      const link = p.get('link' + i) || '/'
      if (!url) continue

      const wrap = document.createElement('div')
      wrap.className = 'bottle-wrap'
      wrap.style.setProperty('--tilt', tilts[i - 1])

      const mv = document.createElement('model-viewer')
      mv.setAttribute('src', url)
      mv.setAttribute('shadow-intensity', '0.8')
      mv.setAttribute('shadow-softness', '1')
      mv.setAttribute('exposure', '1.1')
      mv.setAttribute('environment-image', 'neutral')
      mv.setAttribute('disable-zoom', '')
      mv.setAttribute('interaction-prompt', 'none')
      mv.setAttribute('camera-controls', '')

      wrap.appendChild(mv)
      wrap.addEventListener('click', () => {
        window.parent.postMessage({ type: 'navigate', link }, '*')
        window.top.location.href = link
      })

      container.appendChild(wrap)
    }
  </script>
</body>
</html>
